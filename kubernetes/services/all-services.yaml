# ============================================================
# All remaining microservices
# ============================================================

---
# ── metadata-service ────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metadata-service
  namespace: data-catalog
  labels:
    app: metadata-service
    app.kubernetes.io/part-of: data-catalog
spec:
  replicas: 2
  selector:
    matchLabels:
      app: metadata-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: metadata-service
        app.kubernetes.io/part-of: data-catalog
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8002"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: data-catalog-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: metadata-service
          image: us-central1-docker.pkg.dev/my-data-platform-496418/data-catalog/metadata-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8002
          envFrom:
            - configMapRef:
                name: data-catalog-config
            - secretRef:
                name: data-catalog-secrets
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 800m
              memory: 1.5Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: metadata-service
  namespace: data-catalog
spec:
  selector:
    app: metadata-service
  ports:
    - port: 8002
      targetPort: 8002
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: metadata-service-hpa
  namespace: data-catalog
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: metadata-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75

