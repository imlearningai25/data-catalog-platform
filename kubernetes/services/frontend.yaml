---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: data-catalog
  labels:
    app: frontend
    app.kubernetes.io/part-of: data-catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/part-of: data-catalog
    spec:
      securityContext:
        runAsNonRoot: false  # nginx requires root
      containers:
        - name: frontend
          image: us-central1-docker.pkg.dev/my-data-platform-496418/data-catalog/frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: data-catalog
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
