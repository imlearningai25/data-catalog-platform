---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: data-catalog
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: data-catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: api-gateway
        app.kubernetes.io/part-of: data-catalog
    spec:
      serviceAccountName: data-catalog-sa
      securityContext:
        runAsNonRoot: false  # nginx requires root to bind port / write pid
      containers:
        - name: api-gateway
          image: us-central1-docker.pkg.dev/my-data-platform-496418/data-catalog/api-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: data-catalog
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8000
      targetPort: 8000
