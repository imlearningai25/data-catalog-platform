user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format json_combined escape=json
        '{"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_id":"$req_id",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes_sent":$bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_user_agent":"$http_user_agent"}';

    access_log /var/log/nginx/access.log json_combined;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    gzip               on;
    gzip_types         text/plain application/json application/javascript text/css;

    add_header X-Frame-Options           DENY;
    add_header X-Content-Type-Options    nosniff;
    add_header X-XSS-Protection          "1; mode=block";
    add_header Referrer-Policy           strict-origin-when-cross-origin;
    server_tokens off;

    limit_req_zone  $binary_remote_addr zone=api_limit:10m  rate=100r/s;
    limit_req_zone  $binary_remote_addr zone=auth_limit:5m  rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $connection$msec;
    }

    # Kubernetes-resolvable upstreams (uses pod /etc/resolv.conf → CoreDNS)
    upstream auth_svc           { server auth-service:8006;           keepalive 10; }
    upstream catalog_svc        { server catalog-service:8005;        keepalive 10; }
    upstream connector_svc      { server connector-service:8001;      keepalive 10; }
    upstream metadata_svc       { server metadata-service:8002;       keepalive 10; }
    upstream classification_svc { server classification-service:8003; keepalive 10; }
    upstream term_svc           { server term-service:8004;           keepalive 10; }
    upstream lineage_svc        { server lineage-service:8008;        keepalive 10; }
    upstream audit_svc          { server audit-service:8007;          keepalive 10; }

    server {
        listen 8000;
        server_name _;

        add_header X-Request-ID $req_id always;

        location = /health {
            access_log off;
            return 200 '{"status":"healthy","service":"api-gateway"}';
            add_header Content-Type application/json;
        }

        location = /metrics {
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            deny  all;
            stub_status on;
        }

        # Internal token validation subrequest
        location = /_auth_validate {
            internal;
            if ($request_method = OPTIONS) { return 200; }
            proxy_method            POST;
            proxy_pass              http://auth_svc/auth/introspect;
            proxy_pass_request_body off;
            proxy_set_header        Content-Length "";
            proxy_set_header        X-Original-URI $request_uri;
            proxy_set_header        Authorization $http_authorization;
        }

        location /auth/ {
            limit_req  zone=auth_limit burst=20 nodelay;
            limit_conn conn_limit 10;
            rewrite ^/auth(/.*)$ $1 break;
            proxy_pass http://auth_svc;
            include    /etc/nginx/proxy_params.conf;
        }

        location /catalog/ {
            limit_req zone=api_limit burst=200 nodelay;
            auth_request /_auth_validate;
            rewrite ^/catalog(/.*)$ $1 break;
            proxy_pass http://catalog_svc;
            include    /etc/nginx/proxy_params.conf;
        }

        location /connector/ {
            limit_req zone=api_limit burst=50 nodelay;
            auth_request /_auth_validate;
            rewrite ^/connector(/.*)$ $1 break;
            proxy_pass http://connector_svc;
            include    /etc/nginx/proxy_params.conf;
        }

        location /metadata/ {
            limit_req zone=api_limit burst=100 nodelay;
            auth_request /_auth_validate;
            rewrite ^/metadata(/.*)$ $1 break;
            proxy_pass http://metadata_svc;
            include    /etc/nginx/proxy_params.conf;
        }

        location /classification/ {
            limit_req zone=api_limit burst=200 nodelay;
            auth_request /_auth_validate;
            rewrite ^/classification(/.*)$ $1 break;
            proxy_pass http://classification_svc;
            include    /etc/nginx/proxy_params.conf;
        }

        location /terms/ {
            limit_req zone=api_limit burst=100 nodelay;
            auth_request /_auth_validate;
            rewrite ^/terms(/.*)$ $1 break;
            proxy_pass http://term_svc;
            include    /etc/nginx/proxy_params.conf;
        }

        location /lineage/ {
            limit_req zone=api_limit burst=100 nodelay;
            auth_request /_auth_validate;
            rewrite ^/lineage(/.*)$ $1 break;
            proxy_pass http://lineage_svc;
            include    /etc/nginx/proxy_params.conf;
        }

        location /audit/ {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin  *;
                add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
                add_header Access-Control-Allow-Headers "Authorization, Content-Type";
                return 204;
            }
            limit_req zone=api_limit burst=200 nodelay;
            auth_request /_auth_validate;
            rewrite ^/audit(/.*)$ $1 break;
            proxy_pass http://audit_svc;
            include    /etc/nginx/proxy_params.conf;
        }

        location = /api-docs/catalog.json        { proxy_pass http://catalog_svc/openapi.json; }
        location = /api-docs/connector.json      { proxy_pass http://connector_svc/openapi.json; }
        location = /api-docs/auth.json           { proxy_pass http://auth_svc/openapi.json; }
        location = /api-docs/lineage.json        { proxy_pass http://lineage_svc/openapi.json; }
        location = /api-docs/classification.json { proxy_pass http://classification_svc/openapi.json; }
        location = /api-docs/terms.json          { proxy_pass http://term_svc/openapi.json; }
        location = /api-docs/audit.json          { proxy_pass http://audit_svc/openapi.json; }
        location = /api-docs/metadata.json       { proxy_pass http://metadata_svc/openapi.json; }

        error_page 401 = @error401;
        error_page 403 = @error403;

        location @error401 {
            return 401 '{"error":"Unauthorized","message":"Valid JWT required"}';
            add_header Content-Type application/json;
        }
        location @error403 {
            return 403 '{"error":"Forbidden","message":"Insufficient permissions"}';
            add_header Content-Type application/json;
        }
    }
}
