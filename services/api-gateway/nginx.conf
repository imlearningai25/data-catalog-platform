# ============================================================
# API Gateway — Nginx Configuration
# - Routes requests to microservices
# - Enforces JWT validation on every route (via auth_request)
# - Rate limiting: 100 req/s per IP
# - Request/response logging for audit trail
#
# DNS re-resolution: proxy_pass uses a variable for the hostname
# so nginx re-resolves via Docker DNS (127.0.0.11, valid=10s)
# instead of caching the IP at startup. Path stripping uses
# map directives with positional capture $1.
# ============================================================

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---- Logging (structured JSON for audit ingestion) ----
    log_format json_combined escape=json
        '{"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_id":"$req_id",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes_sent":$bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"}';

    access_log /var/log/nginx/access.log json_combined;

    # ---- DNS resolver (Docker internal) — re-resolve every 10s ----
    # The hostname variable in proxy_pass forces nginx to use this resolver
    # instead of caching upstream IPs at startup.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # ---- Strip service-name prefix for proxy_pass path ----
    # Positional capture $1 grabs everything after the prefix.
    # $request_uri includes query string, so ?params are preserved.
    map $request_uri $path_auth           { ~^/auth(.*)           $1; default /; }
    map $request_uri $path_catalog        { ~^/catalog(.*)        $1; default /; }
    map $request_uri $path_connector      { ~^/connector(.*)      $1; default /; }
    map $request_uri $path_metadata       { ~^/metadata(.*)       $1; default /; }
    map $request_uri $path_classification { ~^/classification(.*)  $1; default /; }
    map $request_uri $path_terms          { ~^/terms(.*)          $1; default /; }
    map $request_uri $path_lineage        { ~^/lineage(.*)        $1; default /; }
    map $request_uri $path_audit          { ~^/audit(.*)          $1; default /; }

    # ---- Performance ----
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    gzip               on;
    gzip_types         text/plain application/json application/javascript text/css;

    # ---- Security headers ----
    add_header X-Frame-Options           DENY;
    add_header X-Content-Type-Options    nosniff;
    add_header X-XSS-Protection          "1; mode=block";
    add_header Referrer-Policy           strict-origin-when-cross-origin;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'";
    server_tokens off;

    # ---- Rate limiting — Zero Trust: limit every IP ----
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:5m  rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ---- Request ID for distributed tracing ----
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $connection$msec;
    }

    server {
        listen 8000;
        server_name _;

        # Unique request ID propagation
        add_header X-Request-ID $req_id always;

        # ---- Health check (no auth needed) ----
        location = /health {
            access_log off;
            return 200 '{"status":"healthy","service":"api-gateway"}';
            add_header Content-Type application/json;
        }

        # ---- Metrics (internal only) ----
        location = /metrics {
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            deny  all;
            stub_status on;
        }

        # ---- Auth service — tighter rate limit ----
        # Frontend calls /auth/auth/login, /auth/users/me, /auth/authz/check etc.
        # Strip the leading /auth prefix so the service receives /auth/login, /users/me, /authz/check.
        location /auth/ {
            set $svc auth-service:8006;
            set $p $path_auth;
            limit_req zone=auth_limit burst=20 nodelay;
            limit_conn conn_limit 10;

            proxy_pass         http://$svc$p;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Request-ID      $req_id;
            proxy_connect_timeout  5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }

        # ---- Internal token validation subrequest ----
        # IMPORTANT: uses $auth_svc (not $svc) to avoid overwriting the
        # parent request's $svc variable — subrequests share variable scope.
        location = /_auth_validate {
            internal;
            if ($request_method = OPTIONS) {
                return 200;
            }
            set $auth_svc auth-service:8006;
            proxy_method            POST;
            proxy_pass              http://$auth_svc/auth/introspect;
            proxy_pass_request_body off;
            proxy_set_header        Content-Length "";
            proxy_set_header        X-Original-URI $request_uri;
            proxy_set_header        Authorization $http_authorization;
        }

        # ---- Catalog API ----
        location /catalog/ {
            # Capture stripped path in rewrite phase (before auth_request access phase)
            set $svc catalog-service:8005;
            set $p $path_catalog;
            limit_req zone=api_limit burst=200 nodelay;
            auth_request /_auth_validate;
            auth_request_set $auth_status $upstream_status;

            proxy_pass       http://$svc$p;
            include          /etc/nginx/proxy_params.conf;
        }

        # ---- Connector API (steward+ only, enforced by auth-service) ----
        location /connector/ {
            # Capture stripped path in rewrite phase (before auth_request access phase)
            set $svc connector-service:8001;
            set $p $path_connector;
            limit_req zone=api_limit burst=50 nodelay;
            auth_request /_auth_validate;

            proxy_pass       http://$svc$p;
            include          /etc/nginx/proxy_params.conf;
        }

        # ---- Metadata API ----
        location /metadata/ {
            set $svc metadata-service:8002;
            set $p $path_metadata;
            limit_req zone=api_limit burst=100 nodelay;
            auth_request /_auth_validate;

            proxy_pass       http://$svc$p;
            include          /etc/nginx/proxy_params.conf;
        }

        # ---- Classification API ----
        location /classification/ {
            set $svc classification-service:8003;
            set $p $path_classification;
            limit_req zone=api_limit burst=200 nodelay;
            auth_request /_auth_validate;

            proxy_pass       http://$svc$p;
            include          /etc/nginx/proxy_params.conf;
        }

        # ---- Terms API ----
        location /terms/ {
            set $svc term-service:8004;
            set $p $path_terms;
            limit_req zone=api_limit burst=100 nodelay;
            auth_request /_auth_validate;

            proxy_pass       http://$svc$p;
            include          /etc/nginx/proxy_params.conf;
        }

        # ---- Lineage API ----
        # Frontend calls /lineage/lineage/edge — strip leading /lineage so service
        # receives /lineage/edge (service routes include the /lineage/ prefix).
        location /lineage/ {
            set $svc lineage-service:8008;
            set $p $path_lineage;
            limit_req zone=api_limit burst=100 nodelay;
            auth_request /_auth_validate;

            proxy_pass       http://$svc$p;
            include          /etc/nginx/proxy_params.conf;
        }

        # ---- Audit API (admin read, all services write) ----
        # Frontend calls /audit/audit/events — strip leading /audit so service
        # receives /audit/events (service routes include the /audit/ prefix).
        location /audit/ {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin  *;
                add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
                add_header Access-Control-Allow-Headers "Authorization, Content-Type";
                return 204;
            }
            set $svc audit-service:8007;
            set $p $path_audit;
            limit_req zone=api_limit burst=200 nodelay;
            auth_request /_auth_validate;

            proxy_pass       http://$svc$p;
            include          /etc/nginx/proxy_params.conf;
        }

        # ---- OpenAPI specs (no auth — specs contain no sensitive data) ----
        location = /api-docs/catalog.json {
            set $svc catalog-service:8005;
            proxy_pass http://$svc/openapi.json;
            add_header Content-Type application/json;
            add_header Access-Control-Allow-Origin *;
        }
        location = /api-docs/connector.json {
            set $svc connector-service:8001;
            proxy_pass http://$svc/openapi.json;
            add_header Content-Type application/json;
            add_header Access-Control-Allow-Origin *;
        }
        location = /api-docs/auth.json {
            set $svc auth-service:8006;
            proxy_pass http://$svc/openapi.json;
            add_header Content-Type application/json;
            add_header Access-Control-Allow-Origin *;
        }
        location = /api-docs/lineage.json {
            set $svc lineage-service:8008;
            proxy_pass http://$svc/openapi.json;
            add_header Content-Type application/json;
            add_header Access-Control-Allow-Origin *;
        }
        location = /api-docs/classification.json {
            set $svc classification-service:8003;
            proxy_pass http://$svc/openapi.json;
            add_header Content-Type application/json;
            add_header Access-Control-Allow-Origin *;
        }
        location = /api-docs/terms.json {
            set $svc term-service:8004;
            proxy_pass http://$svc/openapi.json;
            add_header Content-Type application/json;
            add_header Access-Control-Allow-Origin *;
        }
        location = /api-docs/audit.json {
            set $svc audit-service:8007;
            proxy_pass http://$svc/openapi.json;
            add_header Content-Type application/json;
            add_header Access-Control-Allow-Origin *;
        }
        location = /api-docs/metadata.json {
            set $svc metadata-service:8002;
            proxy_pass http://$svc/openapi.json;
            add_header Content-Type application/json;
            add_header Access-Control-Allow-Origin *;
        }

        # ---- 401/403 error responses ----
        error_page 401 = @error401;
        error_page 403 = @error403;

        location @error401 {
            return 401 '{"error":"Unauthorized","message":"Valid JWT required"}';
            add_header Content-Type application/json;
        }
        location @error403 {
            return 403 '{"error":"Forbidden","message":"Insufficient permissions"}';
            add_header Content-Type application/json;
        }
    }
}
