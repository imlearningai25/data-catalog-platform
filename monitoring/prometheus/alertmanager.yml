global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'service']
  group_wait:      30s
  group_interval:  5m
  repeat_interval: 4h
  receiver: 'null'

  routes:
    - match:
        severity: critical
      receiver: 'null'
    - match:
        severity: warning
      receiver: 'null'

# POC: blackhole receiver — replace with real Slack/PagerDuty/email config for production
receivers:
  - name: 'null'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service']
